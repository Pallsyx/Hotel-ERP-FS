<!DOCTYPE html>
<html>
<head>
    <title>Lễ Tân - Live Room Status</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body style="font-family: Arial; background: #222; color: #fff; padding: 20px;">
    <h2>Bảng Trực Lễ Tân (Real-time)</h2>
    <div id="messages" style="border: 1px solid #00ff00; padding: 10px; height: 300px; overflow-y: auto;">
        Đang chờ kết nối...<br>
    </div>

    <script>
        // Nhớ đổi port 5080 thành port của mày nếu nó khác nhé
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5080/roomHub") 
            .build();

        // Lắng nghe tín hiệu "ReceiveRoomStatusUpdate" từ Server bắn xuống
        connection.on("ReceiveRoomStatusUpdate", (roomId, status, cleaningStatus) => {
            const msg = `[Vừa xong] 🔔 Phòng số ${roomId} đã đổi thành: Status='${status}' | Dọn dẹp='${cleaningStatus}'`;
            const div = document.createElement("div");
            div.style.color = "#00ff00";
            div.textContent = msg;
            document.getElementById("messages").prepend(div);
        });

        // Bắt đầu kết nối
        connection.start()
            .then(() => document.getElementById("messages").innerHTML += "🟢 Đã kết nối SignalR thành công! Chờ trạng thái phòng thay đổi...<br>")
            .catch(err => console.error("Lỗi kết nối: ", err));
    </script>
</body>
</html>
